name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build and test (macOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test
        run: make test
      - name: Build the app
        run: make app
      - name: Check the bundle
        run: |
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' build/twoByFour.app/Contents/Info.plist)" = "dev"
          codesign --verify --deep --strict build/twoByFour.app
          build/twoByFour.app/Contents/MacOS/twobyfour --snapshot-notepad build/notepad.png
          test -s build/notepad.png

  ios:
    name: Build and test (iOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          xcodebuild -version
          brew install xcodegen
      - name: Pick a simulator
        run: |
          sim=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [^(]+' | sed 's/ *$//')
          test -n "$sim"
          echo "IOS_SIM=$sim" >> "$GITHUB_ENV"
      - name: Test (unit and UI tests in the simulator)
        run: make ios-test IOS_SIM="$IOS_SIM"

  server:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
