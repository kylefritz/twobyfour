name: TestFlight

# Every commit on main that passes CI goes to TestFlight as the next patch
# version (the Mac's beta number without "-beta"), build number = this run's
# number. Until the API key secrets are set (README, "iPhone app") the job
# says so and skips the upload.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  testflight:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: macos-26
    env:
      SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Secrets
        id: secrets
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          if [ -z "$ASC_KEY_ID" ]; then
            echo "::notice::TestFlight secrets not set; skipping upload"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Version
        if: steps.secrets.outputs.ready == 'true'
        run: |
          last=$(git tag --list 'v[0-9]*' --sort=-v:refname | grep -v -e '-' | head -1)
          IFS=. read -r major minor patch <<< "${last:-v0.0.0}"
          major=${major#v}
          echo "VERSION=$major.$minor.$((patch + 1))" >> "$GITHUB_ENV"
      - name: API key
        if: steps.secrets.outputs.ready == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          echo "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Build and upload
        if: steps.secrets.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          brew install xcodegen
          scripts/testflight.sh "$VERSION" "$GITHUB_RUN_NUMBER" "${SHA:0:7}"
      - name: Remove the key
        if: always() && steps.secrets.outputs.ready == 'true'
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
